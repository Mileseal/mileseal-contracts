name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Install stellar CLI
        run: |
          curl -fsSL -o stellar-cli.deb \
            https://github.com/stellar/stellar-cli/releases/download/v30.0.1/stellar-cli_30.0.1_amd64.deb
          sudo dpkg -i stellar-cli.deb
          rm stellar-cli.deb

      - name: stellar contract build
        run: stellar contract build
